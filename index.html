<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية تكتيكات مقابلات العمل | Job Interview Academy</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { 
            --bg: #0a1128; 
            --sidebar: #101f42; 
            --accent: #00b4d8; 
            --text: #e2e8f0; 
            --success: #10b981;
            --danger: #ef4444;
        }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        #lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: var(--sidebar); padding: 40px; border-radius: 20px; border: 1px solid var(--accent); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box input { padding: 12px; border-radius: 8px; border: none; width: 220px; text-align: center; margin-bottom: 15px; outline: none; font-family: 'Cairo', sans-serif; font-size: 1rem; }
        .login-box button { background: var(--accent); color: white; border: none; padding: 10px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo', sans-serif; transition: 0.3s; }
        .login-box button:hover { background: #0077b6; }

        .sidebar { width: 350px; background: var(--sidebar); border-left: 1px solid rgba(0,180,216,0.2); display: flex; flex-direction: column; }
        .sidebar-header { padding: 25px 25px 15px 25px; text-align: center; border-bottom: 1px solid rgba(0,180,216,0.1); }
        .sidebar-header img { max-width: 160px; height: auto; }
        
        .progress-box { padding: 15px 20px; background: rgba(0,180,216,0.05); margin: 0; border-bottom: 1px solid rgba(0,180,216,0.15); font-size: 0.85rem; }
        .progress-text-container { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--text); }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), #90e0ef); transition: width 0.4s ease; border-radius: 10px; }

        .lessons-list { flex-grow: 1; overflow-y: auto; padding: 15px; }
        
        .section-title { font-size: 0.9rem; color: var(--accent); font-weight: bold; margin: 15px 5px 5px 5px; padding-bottom: 5px; border-bottom: 1px solid rgba(0,180,216,0.1); }
        .lesson-item { background: rgba(255,255,255,0.02); padding: 12px 15px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: 0.3s; font-size: 0.95rem; }
        .lesson-item .lesson-info { display: flex; align-items: center; gap: 12px; flex-grow: 1; }
        .lesson-item.active { background: var(--accent); color: white; font-weight: bold; }
        .lesson-item i { font-size: 1.1rem; }
        
        .completion-btn-zone { padding: 5px; cursor: pointer; color: rgba(255,255,255,0.2); transition: 0.2s; }
        .completion-btn-zone:hover { color: var(--success); }
        .lesson-item.completed-item .completion-btn-zone { color: var(--success); }
        .lesson-item.active .completion-btn-zone { color: rgba(255,255,255,0.4); }
        .lesson-item.active.completed-item .completion-btn-zone { color: white; }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; background: #020617; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        iframe, video { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        
        .details { padding: 30px; background: #070a13; border-top: 1px solid rgba(0,180,216,0.1); flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }
        .details-text h1 { color: var(--accent); margin: 0; font-size: 1.8rem; }
        .details-text p { margin-top: 10px; color: #94a3b8; line-height: 1.7; font-size: 1.05rem; }

        .samir-widget { position: fixed; bottom: 20px; left: 20px; width: 350px; background: var(--sidebar); border: 1px solid var(--accent); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); z-index: 1000; overflow: hidden; display: flex; flex-direction: column; font-family: 'Cairo', sans-serif; transition: 0.3s ease; }
        .samir-header { background: linear-gradient(135deg, var(--sidebar), #162c5d); padding: 12px 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(0,180,216,0.15); }
        .samir-avatar { width: 38px; height: 38px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff; position: relative; }
        .samir-status { width: 9px; height: 9px; background: var(--success); border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid var(--sidebar); }
        .samir-title { font-weight: bold; font-size: 0.9rem; color: #fff; }
        .samir-subtitle { font-size: 0.75rem; color: #94a3b8; }
        .samir-body { padding: 15px; min-height: 120px; max-height: 160px; overflow-y: auto; font-size: 0.9rem; line-height: 1.6; color: #e2e8f0; background: rgba(0,0,0,0.2); text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .samir-input-zone { display: none; background: rgba(0,0,0,0.3); padding: 10px; align-items: center; gap: 8px; border-bottom: 1px solid rgba(0,180,216,0.1); }
        .samir-input-zone input { flex-grow: 1; background: #0a1128; border: 1px solid rgba(0,180,216,0.3); padding: 8px 12px; border-radius: 20px; color: #fff; outline: none; font-family: 'Cairo', sans-serif; font-size: 0.85rem; text-align: left; direction: ltr; }
        .samir-input-zone button { background: var(--accent); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; transition: 0.2s; }

        .samir-controls { padding: 12px; display: flex; justify-content: center; gap: 10px; background: var(--sidebar); }
        .samir-btn { border: none; padding: 8px 18px; border-radius: 30px; font-family: 'Cairo', sans-serif; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; transition: 0.2s; }
        .btn-start { background: var(--accent); color: white; width: 100%; justify-content: center; }
        .btn-mic { background: var(--success); color: white; display: none; }
        .btn-mic.listening { background: var(--danger); }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="login-box">
            <h2 style="color:var(--accent)">دخول منصة تكتيكات المقابلات</h2>
            <input type="password" id="passCode" placeholder="أدخل رمز الدخول">
            <br>
            <button onclick="checkAccess()">دخول المنصة</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header"><img src="https://res.cloudinary.com/dr3i6fqai/image/upload/v1778799805/logo_anelqt.png"></div>
        <div class="progress-box">
            <div class="progress-text-container"><span>جاهزيتك لمقابلة العمل</span><span id="progressPercent">0%</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
        </div>
        <div class="lessons-list">
            <div class="section-title">المرحلة الأولى: كسر الجليد</div>
            <div class="lesson-item active" id="job-lesson-1">
                <div class="lesson-info" onclick="playMedia('1uLibKKZNJbl4LiHk_7pSSywnx-Zx1Q2L', '1. تكتيك المقابلة التعريفية', 'تعلم الأسلوب الاحترافي لتقديم نفسك...', 'drive', this.parentElement)">
                    <i class="fas fa-user-tie"></i> <span>1. تكتيك المقابلة التعريفية</span>
                </div>
                <div class="completion-btn-zone" onclick="toggleLessonCompletion('job-lesson-1', event)"><i class="fas fa-check-circle"></i></div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="video-container" id="playerWrapper">
            <iframe id="driveFrame" src="https://drive.google.com/file/d/1uLibKKZNJbl4LiHk_7pSSywnx-Zx1Q2L/preview" allowfullscreen></iframe>
        </div>
        <div class="details">
            <div class="details-text">
                <h1 id="titleText">1. تكتيك المقابلة التعريفية</h1>
                <p id="descText">تعلم الأسلوب الاحترافي لتقديم نفسك...</p>
            </div>
        </div>
    </main>

    <div class="samir-widget">
        <div class="samir-header">
            <div class="samir-avatar"><i class="fas fa-user-tie"></i><div class="samir-status"></div></div>
            <div>
                <div class="samir-title">الأستاذ سامر | خبير الـ HR</div>
                <div class="samir-subtitle">اتصال مستقر وآمن 🔒</div>
            </div>
        </div>
        
        <div class="samir-body" id="samirTextBox">مرحباً بك! اضغط على زر "ابدأ المقابلة التجريبية" للبدء..</div>

        <div class="samir-input-zone" id="inputZone">
            <input type="text" id="samirInputField" placeholder="Type your answer here in English..." onkeypress="handleKeyPress(event)">
            <button onclick="sendTextAnswer()"><i class="fas fa-paper-plane"></i></button>
        </div>

        <div class="samir-controls">
            <button class="samir-btn btn-start" id="startBtn" onclick="initSamir()">ابدأ المقابلة التجريبية <i class="fas fa-play"></i></button>
            <button class="samir-btn btn-mic" id="micBtn" onclick="toggleMic()">تحدث الآن <i class="fas fa-microphone"></i></button>
        </div>
    </div>

    <script>
        // رابط السيرفر الأونلاين الخاص بك على Hugging Face 🚀
        const SERVER_URL = "https://mustafamakahleh-samir-hr-agent.hf.space";

        let recognition;
        let isListening = false;
        const totalLessons = 1;
        let completedLessons = new Set();

        function checkAccess() {
            if(document.getElementById('passCode').value === '51talk') {
                document.getElementById('lock-screen').style.display = 'none';
                initSpeechRecognition();
            } else { alert('الرمز خطأ!'); }
        }

        function playMedia(id, title, desc, type, element) {
            document.querySelectorAll('.lesson-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('titleText').innerText = title;
            document.getElementById('descText').innerText = desc;
            
            const wrapper = document.getElementById('playerWrapper');
            if(type === 'drive') {
                wrapper.innerHTML = `<iframe id="driveFrame" src="https://drive.google.com/file/d/DirectID/preview" allowfullscreen></iframe>`.replace('DirectID', id);
            }
        }

        function toggleLessonCompletion(id, event) {
            event.stopPropagation();
            const element = document.getElementById(id);
            if(completedLessons.has(id)) {
                completedLessons.delete(id);
                element.classList.remove('completed-item');
            } else {
                completedLessons.add(id);
                element.classList.add('completed-item');
            }
            const percent = Math.round((completedLessons.size / totalLessons) * 100);
            document.getElementById('progressPercent').innerText = percent + '%';
            document.getElementById('progressBar').style.width = percent + '%';
        }

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.onstart = () => {
                    isListening = true;
                    document.getElementById('micBtn').innerHTML = 'جاري الاستماع... <i class="fas fa-spinner fa-spin"></i>';
                };
                recognition.onend = () => {
                    isListening = false;
                    document.getElementById('micBtn').innerHTML = 'تحدث الآن <i class="fas fa-microphone"></i>';
                };
                recognition.onresult = async (event) => {
                    const studentText = event.results[0][0].transcript;
                    if (!studentText.trim()) return;
                    showSamirText(`أنت: ${studentText}`);
                    await talkToGemini(studentText);
                };
            }
        }

        function toggleMic() {
            if (!recognition) return;
            if (isListening) { recognition.stop(); } else { recognition.start(); }
        }

        function showSamirText(text) {
            const box = document.getElementById('samirTextBox');
            box.innerText = text;
            box.scrollTop = box.scrollHeight;
        }

        function samirSpeak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function initSamir() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('micBtn').style.display = 'flex';
            document.getElementById('inputZone').style.display = 'flex';
            
            try {
                await fetch(`${SERVER_URL}/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: "student_session_1" })
                });
            } catch(e) {}

            const initialGreeting = "Hello! I am Mr. Samir, your HR interviewer today. Let's start our mock interview. Could you please tell me about yourself?";
            showSamirText(`سامر: ${initialGreeting}`);
            samirSpeak(initialGreeting);
        }

        async function sendTextAnswer() {
            const inputField = document.getElementById('samirInputField');
            const answer = inputField.value.trim();
            if(!answer) return;
            inputField.value = "";
            showSamirText(`أنت: ${answer}`);
            await talkToGemini(answer);
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendTextAnswer(); }

        async function talkToGemini(studentResponse) {
            showSamirText("سامر يفكر... 🧠");
            try {
                const response = await fetch(`${SERVER_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: "student_session_1", message: studentResponse })
                });
                
                const data = await response.json();
                
                if (data.reply) {
                    showSamirText(`سامر: ${data.reply}`);
                    samirSpeak(data.reply);
                } else {
                    showSamirText("⚠️ حدث خطأ في معالجة البيانات داخل السيرفر الأونلاين.");
                }
            } catch (error) {
                showSamirText("❌ تعذر الاتصال بالسيرفر أونلاين. تأكد أن الـ Space في Hugging Face بحالة Running.");
            }
        }
    </script>
</body>
</html>
